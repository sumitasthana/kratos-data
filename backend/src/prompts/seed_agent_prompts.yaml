version: "1.0"
description: "Prompts for Seed Agent Phase B - Distribution specification generation"
agent: "SeedAgent"
last_updated: "2026-03-16"

prompts:
  field_distribution_inference:
    version: "1.0"
    name: "Infer Field Distribution Strategy"
    description: "LLM prompt to determine distribution strategy for unresolved fields"
    system_role: "You are a data generation expert specializing in synthetic data distributions."
    template: |
      Determine the appropriate distribution strategy for the following field.
      
      Table: {table_name}
      Field: {field_name}
      Type: {field_type}
      Nullable: {nullable}
      Context: {field_context}
      Related Fields: {related_fields_json}
      
      Consider:
      1. Field type (numeric, string, date, etc.)
      2. Business domain and context
      3. Relationships to other fields
      4. Realistic value ranges and patterns
      
      Return a JSON object with:
      {{
        "strategy": "distribution | date_range | regex | conditional | computed",
        "params": {{}},
        "distribution": "normal | uniform | poisson | exponential | custom",
        "min": null,
        "max": null,
        "pattern": null,
        "rationale": "explanation"
      }}
    parameters:
      - name: "table_name"
        type: "string"
        description: "Name of the table"
      - name: "field_name"
        type: "string"
        description: "Name of the field"
      - name: "field_type"
        type: "string"
        description: "SQL type of the field"
      - name: "nullable"
        type: "boolean"
        description: "Whether field is nullable"
      - name: "field_context"
        type: "string"
        description: "Business context and description"
      - name: "related_fields_json"
        type: "json"
        description: "Related fields and their strategies"
    model: "claude-sonnet-4-20250514"
    max_tokens: 1024
    temperature: 0.5
    notes: "Used for Phase B to fill unresolved fields from Phase A"

  cross_field_rule_inference:
    version: "1.0"
    name: "Infer Cross-Field Rules"
    description: "LLM prompt to identify and define cross-field generation rules"
    system_role: "You are a data generation expert specializing in field relationships and constraints."
    template: |
      Identify cross-field generation rules for the following table.
      
      Table: {table_name}
      Fields: {fields_json}
      Constraints: {constraints_json}
      
      Look for:
      1. Dependent field relationships
      2. Sum/aggregate constraints
      3. Date ordering constraints
      4. Logical field dependencies
      
      Return a JSON array of rules:
      [
        {{
          "type": "sum_constraint | ordering | dependency | aggregate",
          "fields_involved": ["field1", "field2"],
          "rule": "description of the rule",
          "source": "inferred | constraint"
        }}
      ]
    parameters:
      - name: "table_name"
        type: "string"
        description: "Name of the table"
      - name: "fields_json"
        type: "json"
        description: "JSON array of field definitions"
      - name: "constraints_json"
        type: "json"
        description: "JSON array of check constraints"
    model: "claude-sonnet-4-20250514"
    max_tokens: 1024
    temperature: 0.4
    notes: "Used to infer complex field relationships for realistic data generation"

  nullable_rate_inference:
    version: "1.0"
    name: "Infer Nullable Rate"
    description: "LLM prompt to determine nullable rate for optional fields"
    system_role: "You are a data generation expert specializing in data quality and realism."
    template: |
      Determine the appropriate nullable rate for the following field.
      
      Table: {table_name}
      Field: {field_name}
      Type: {field_type}
      Business Context: {business_context}
      Similar Fields: {similar_fields_json}
      
      Consider:
      1. Business logic and domain rules
      2. Data quality standards
      3. Real-world patterns
      4. Similar fields in the schema
      
      Return a JSON object:
      {{
        "nullable_rate": 0.0-1.0,
        "rationale": "explanation",
        "confidence": "high | medium | low"
      }}
    parameters:
      - name: "table_name"
        type: "string"
        description: "Name of the table"
      - name: "field_name"
        type: "string"
        description: "Name of the field"
      - name: "field_type"
        type: "string"
        description: "SQL type of the field"
      - name: "business_context"
        type: "string"
        description: "Business context and purpose"
      - name: "similar_fields_json"
        type: "json"
        description: "Similar fields and their nullable rates"
    model: "claude-sonnet-4-20250514"
    max_tokens: 512
    temperature: 0.3
    notes: "Used to infer realistic null rates for optional fields"
