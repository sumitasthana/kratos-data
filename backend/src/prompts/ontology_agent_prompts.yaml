version: "1.0"
description: "Prompts for Ontology Agent - Schema extraction and analysis"
agent: "OntologyAgent"
last_updated: "2026-03-16"

prompts:
  conditional_group_detection:
    version: "1.0"
    name: "Detect Conditional Groups"
    description: "LLM prompt to identify conditional groups in tables based on enum fields and business logic"
    system_role: "You are a database schema expert analyzing conditional field groups."
    template: |
      Analyze the following table schema and identify conditional groups.
      
      A conditional group is a set of fields that should only be populated when a specific condition is met.
      For example, if a table has a 'party_type' field with values [Individual, Organization, Government],
      then fields like 'individual_name', 'organization_tax_id', 'government_jurisdiction' form conditional groups.
      
      Table: {table_name}
      Columns: {columns_json}
      Enums: {enums_json}
      
      Return a JSON array of conditional groups with this structure:
      [
        {{
          "condition_field": "field_name",
          "condition_value": "enum_value",
          "fields": ["field1", "field2", ...]
        }}
      ]
      
      Only return the JSON array, no other text.
    parameters:
      - name: "table_name"
        type: "string"
        description: "Name of the table being analyzed"
      - name: "columns_json"
        type: "json"
        description: "JSON array of column definitions"
      - name: "enums_json"
        type: "json"
        description: "JSON object of enum definitions"
    model: "claude-sonnet-4-20250514"
    max_tokens: 2048
    temperature: 0.3
    notes: "Used for Phase A LLM-assisted conditional group detection"

  schema_validation:
    version: "1.0"
    name: "Validate Schema Consistency"
    description: "LLM prompt to validate schema consistency and identify potential issues"
    system_role: "You are a database schema validation expert."
    template: |
      Validate the following schema for consistency and identify potential issues.
      
      Schema: {schema_json}
      
      Check for:
      1. Missing primary keys
      2. Orphaned foreign keys
      3. Circular dependencies
      4. Naming convention violations
      5. Type inconsistencies
      
      Return findings as JSON.
    parameters:
      - name: "schema_json"
        type: "json"
        description: "Complete schema graph JSON"
    model: "claude-sonnet-4-20250514"
    max_tokens: 2048
    temperature: 0.2
    notes: "Optional validation prompt for schema quality assurance"
